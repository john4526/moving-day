[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "movingday"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "google-auth",
    "pytest",
    "pytest-html",
    "pywin32; sys_platform == 'win32'",
]

[project.scripts]
movingday = "movingday.cli:main"

[tool.setuptools]
packages = ["movingday", "movingday.validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
